{% extends "base.html" %}
{% block title %}{{ t.register_title }}{% endblock %}
{% block content_full %}
<div x-data="{ loading: false }">
  <div class="bg-white rounded-3xl p-8 shadow-2xl">
    <div class="flex flex-col items-center mb-6">
      <div class="w-14 h-14 rounded-2xl flex items-center justify-center mb-4" style="background:linear-gradient(135deg,#6E56CF,#5B45B9);box-shadow:0 8px 20px rgba(94,84,207,.35)">
        <svg width="28" height="28" viewBox="0 0 44 44" fill="none"><path d="M11.5 13.1 C14.1 8 19.3 5.5 22 5.5 C24.7 5.5 29.9 8 32.5 13.1" stroke="white" stroke-width="4" stroke-linecap="round"/><path d="M32.5 13.1 C32.3 15.6 30.4 17.1 28.1 17.1 C30.1 15.9 31.5 14.4 32.5 13.1" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M32.5 30.9 C29.9 36 24.7 38.5 22 38.5 C19.3 38.5 14.1 36 11.5 30.9" stroke="white" stroke-width="4" stroke-linecap="round"/><path d="M11.5 30.9 C11.7 33.4 13.6 34.9 15.9 34.9 C13.9 33.7 12.5 32.2 11.5 30.9" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="22" cy="22" r="4.5" fill="#FFD166"/></svg>
      </div>
      <h1 class="text-xl font-bold text-gray-900">Agent Context Sync</h1>
      <p class="text-gray-400 text-sm mt-1">{{ t.register_subtitle }}</p>
    </div>

    {% if error %}
    <div class="mb-4 px-4 py-3 rounded-xl bg-red-50 text-red-600 border border-red-100 text-sm">
      {{ t[error] if error in t else error }}
    </div>
    {% endif %}
    <div id="pwd-mismatch" class="hidden mb-4 px-4 py-3 rounded-xl bg-red-50 text-red-600 border border-red-100 text-sm">
      {{ t.pwd_mismatch }}
    </div>

    <form method="POST" action="/web/register" @submit="loading = true" onsubmit="return checkPasswords()">
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-500 mb-1.5">{{ t.register_username }}</label>
        <input type="text" name="username" required autofocus
               class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#6E56CF] focus:bg-white focus:border-transparent text-sm transition-colors">
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-500 mb-1.5">{{ t.register_display_name }}</label>
        <input type="text" name="display_name"
               class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#6E56CF] focus:bg-white focus:border-transparent text-sm transition-colors">
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-500 mb-1.5">{{ t.register_password }}</label>
        <input type="password" name="password" required minlength="6"
               class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#6E56CF] focus:bg-white focus:border-transparent text-sm transition-colors">
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-500 mb-1.5">{{ t.register_confirm_password }}</label>
        <input type="password" name="confirm_password" required minlength="6"
               class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#6E56CF] focus:bg-white focus:border-transparent text-sm transition-colors">
      </div>
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-500 mb-1.5">{{ t.register_invite_code }}</label>
        <input type="text" name="invite_code" value="{{ code or '' }}" placeholder="{{ t.register_invite_code_optional }}"
               class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#6E56CF] focus:bg-white focus:border-transparent text-sm transition-colors">
      </div>
      <button type="submit" :disabled="loading"
              class="w-full py-2.5 bg-[#6E56CF] hover:bg-[#5B45B9] disabled:opacity-50 text-white font-semibold rounded-xl transition-colors text-sm shadow-lg shadow-[#6E56CF]/30">
        <span x-show="!loading">{{ t.register_submit }}</span>
        <span x-show="loading" x-cloak>{{ t.register_submitting }}</span>
      </button>
    </form>
  </div>

  <div class="mt-6 text-center">
    <a href="/web/login" class="text-sm text-white/80 hover:text-white transition-colors">{{ t.register_back_to_login }}</a>
  </div>
  <div class="mt-4 text-center">
    <a href="/web/set-language/zh-CN" class="text-xs text-white/60 hover:text-white transition-colors mr-2">中文</a>
    <span class="text-white/30">|</span>
    <a href="/web/set-language/en" class="text-xs text-white/60 hover:text-white transition-colors ml-2">EN</a>
  </div>
</div>

<script>
function checkPasswords() {
  var p = document.querySelector('input[name="password"]');
  var c = document.querySelector('input[name="confirm_password"]');
  var el = document.getElementById('pwd-mismatch');
  if (p.value !== c.value) {
    el.classList.remove('hidden');
    return false;
  }
  el.classList.add('hidden');
  return true;
}
</script>
{% endblock %}
