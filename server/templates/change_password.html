{% extends "base.html" %}
{% block title %}{{ t.pwd_forced_title }} - Agent Context Sync{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-10">
  <div class="bg-white border border-gray-100 rounded-2xl p-6 shadow-md shadow-[#6E56CF]/5">
    <h2 class="text-lg font-semibold text-gray-900 mb-2">{{ t.pwd_forced_title }}</h2>
    {% if forced %}
    <div class="mb-5 px-4 py-3 rounded-xl text-sm bg-amber-50 text-amber-700 border border-amber-600/20">
      {{ t.pwd_forced_notice }}
    </div>
    {% endif %}
    <form method="POST" action="/web/change-password" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-500 mb-1.5">{{ t.dash_current_password }}</label>
        <input type="password" name="old_password" required autofocus
               class="w-full px-4 py-2.5 bg-white border border-gray-300 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#6E56CF] focus:border-transparent text-sm">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-500 mb-1.5">{{ t.dash_new_password }}</label>
        <input type="password" name="new_password" required minlength="6"
               class="w-full px-4 py-2.5 bg-white border border-gray-300 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#6E56CF] focus:border-transparent text-sm">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-500 mb-1.5">{{ t.dash_confirm_password }}</label>
        <input type="password" name="confirm_password" required minlength="6"
               class="w-full px-4 py-2.5 bg-white border border-gray-300 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#6E56CF] focus:border-transparent text-sm">
      </div>
      <button type="submit"
              class="w-full px-4 py-2.5 bg-[#6E56CF] hover:bg-[#5B45B9] text-white text-sm font-medium rounded-xl transition-colors">
        {{ t.dash_change_password }}
      </button>
    </form>
  </div>
</div>
{% endblock %}
