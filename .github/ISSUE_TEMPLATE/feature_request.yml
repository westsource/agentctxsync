name: Feature Request
description: 提议一个新功能 / Suggest an idea
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述清楚你想解决的问题和期望的方案。
        Thanks for the suggestion! Please describe the problem you are solving.
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 你想解决什么问题？当前方案哪里不够用？
      placeholder: 当我…的时候，因为…，所以很不方便。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案 / Proposed solution
      description: 你希望怎么实现？描述得越具体越好。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives
      description: 你还考虑过哪些别的做法？
  - type: dropdown
    id: component
    attributes:
      label: 相关组件 / Related component
      description: 这个功能主要影响哪个部分？
      options:
        - MCP 客户端 (mcp/)
        - 服务端 API (server/)
        - Web UI
        - 新增 Agent 适配器
        - 其他 / 不确定
